substitutions:
  device_name: air-stone-controller
  friendly_name: Air Stone Controller
  i2c_sda_pin: GPIO4
  i2c_scl_pin: GPIO5
  pump_pin: GPIO18
  ina219_address: "0x40"
  shunt_resistance: "0.1 ohm"  # R100; verify the actual board marking.
  battery_cutoff: "3.30"
  battery_recovery: "3.60"
  current_limit: "2.50"  # Total battery-side current; verify against hardware.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # PlatformIO build paths cannot contain spaces.
  build_path: /private/tmp/air-stone-controller-build/${device_name}
  min_version: 2026.9.1
  includes:
    # Angle form places the type before generated globals; path form copies it.
    - <pump_controller.h>
    - pump_controller.h
  project:
    name: hydroponics.air_stone_controller
    version: "0.1.0"
  on_boot:
    priority: 700
    then:
      - switch.turn_off: pump_output
  on_shutdown:
    priority: 700
    then:
      - switch.turn_off: pump_output

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  # Continue the local schedule if Home Assistant is offline.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption: {}
    on_begin:
      then:
        - lambda: |-
            id(maintenance) = true;
            id(controller).stop(millis());
        - switch.turn_off: pump_output
    on_error:
      then:
        - lambda: id(maintenance) = false;

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  reboot_timeout: 0s

preferences:
  flash_write_interval: 5min

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 50kHz

globals:
  - id: controller
    type: air_stone::PumpController
    restore_value: false
    initial_value: 'air_stone::PumpController()'
  - id: last_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sample_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: maintenance
    type: bool
    restore_value: false
    initial_value: 'false'

switch:
  - platform: gpio
    id: pump_output
    internal: true
    pin: ${pump_pin}
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Automatic Schedule
    id: automatic_schedule
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(controller).schedule_now();
    turn_off_action:
      - lambda: id(controller).stop(millis());
      - switch.turn_off: pump_output
  - platform: template
    name: Pump
    id: pump_control
    icon: mdi:air-filter
    lambda: return id(pump_output).state;
    turn_on_action:
      - lambda: id(controller).request_run();
    turn_off_action:
      - lambda: id(controller).stop(millis());
      - switch.turn_off: pump_output

number:
  - platform: template
    name: Pump Run Time
    id: run_seconds
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: s
    mode: box
    entity_category: config
  - platform: template
    name: Pump Rest Time
    id: rest_minutes
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 1
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box
    entity_category: config

button:
  - platform: template
    name: Run Pump Once
    icon: mdi:play
    on_press:
      - lambda: id(controller).request_run();
  - platform: template
    name: Stop Pump
    icon: mdi:stop
    on_press:
      - lambda: id(controller).stop(millis());
      - switch.turn_off: pump_output
  - platform: template
    name: Clear Safety Trip
    entity_category: config
    on_press:
      - lambda: |-
          const bool healthy = id(sample_seen) &&
              millis() - id(last_sample_ms) < 5000U &&
              std::isfinite(id(battery_voltage).state) &&
              id(battery_voltage).state >= ${battery_recovery} &&
              id(battery_voltage).state <= 4.35f &&
              std::isfinite(id(battery_current).state) &&
              std::fabs(id(battery_current).state) < ${current_limit};
          if (!id(controller).clear_fault(healthy, millis()))
            ESP_LOGW("pump", "Cannot clear: need fresh INA219, battery >= ${battery_recovery} V and safe current");
  - platform: restart
    name: Restart
    entity_category: diagnostic

sensor:
  - platform: ina219
    id: battery_monitor
    address: ${ina219_address}
    shunt_resistance: ${shunt_resistance}
    max_voltage: 16.0V
    max_current: 3.2A
    update_interval: 1s
    bus_voltage:
      name: Load Bus Voltage
      id: bus_voltage
      accuracy_decimals: 3
      entity_category: diagnostic
    shunt_voltage:
      name: Shunt Voltage
      id: shunt_voltage
      accuracy_decimals: 4
      entity_category: diagnostic
    current:
      name: Battery Current
      id: battery_current
      accuracy_decimals: 3
    power:
      # Last published field in ESPHome 2026.9.1's INA219 update():
      # only mark a complete sample fresh after all four register reads succeed.
      id: ina_power
      internal: true
      on_value:
        then:
          - lambda: |-
              id(last_sample_ms) = millis();
              id(sample_seen) = true;
              // INA219 bus voltage is VIN- to GND. Add shunt drop to recover VIN+.
              const float voltage = id(bus_voltage).state + id(shunt_voltage).state;
              const float current = id(battery_current).state;
              id(battery_voltage).publish_state(voltage);
              id(battery_power).publish_state(voltage * current);
              // Separate discharge from charging for HA energy statistics.
              id(discharge_power).publish_state(std::fmax(0.0f, voltage * current));
  - platform: template
    name: Battery Voltage
    id: battery_voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    name: Battery Power
    id: battery_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    name: Discharge Power
    id: discharge_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: integration
    name: Energy Used
    sensor: discharge_power
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 4
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Online
  - platform: template
    name: Pump Output Active
    # Output commanded on; a single shared INA219 cannot prove pump operation.
    lambda: return id(pump_output).state;
  - platform: template
    name: Safety Trip
    device_class: problem
    lambda: return id(controller).fault;
  - platform: template
    name: Power Monitor Healthy
    lambda: |-
      return id(sample_seen) && millis() - id(last_sample_ms) < 5000U &&
             std::isfinite(id(battery_voltage).state) &&
             id(battery_voltage).state > 0.0f && id(battery_voltage).state <= 4.35f &&
             std::isfinite(id(battery_current).state);

text_sensor:
  - platform: template
    name: Pump Status
    lambda: return {id(controller).status};
    update_interval: 1s
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (id(maintenance)) {
            id(pump_output).turn_off();
            return;
          }
          const bool fresh = id(sample_seen) && millis() - id(last_sample_ms) < 5000U;
          // Do not extrapolate the last power measurement across a sensor outage.
          if (!fresh && id(discharge_power).state != 0.0f) {
            id(discharge_power).publish_state(0.0f);
            id(battery_power).publish_state(NAN);
            id(battery_voltage).publish_state(NAN);
            id(battery_current).publish_state(NAN);
          }
          const bool run = id(controller).tick(millis(), id(automatic_schedule).state,
              uint32_t(id(run_seconds).state * 1000.0f),
              uint32_t(id(rest_minutes).state * 60000.0f), fresh,
              id(battery_voltage).state, id(battery_current).state,
              ${battery_cutoff}, ${current_limit});
          if (run != id(pump_output).state) {
            if (run) id(pump_output).turn_on();
            else id(pump_output).turn_off();
            ESP_LOGI("pump", "%s", id(controller).status);
          }
