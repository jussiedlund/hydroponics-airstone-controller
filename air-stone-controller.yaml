substitutions:
  device_name: air-stone-controller
  friendly_name: Air Stone Controller
  i2c_sda_pin: GPIO6
  i2c_scl_pin: GPIO7
  pump_pin: GPIO18
  manual_button_pin: GPIO0
  ina219_address: "0x40"
  shunt_resistance: "0.1 ohm"  # R100; verify the actual board marking.
  battery_cutoff: "3.30"
  battery_recovery: "3.60"
  current_limit: "2.50"  # Total battery-side current; verify against hardware.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # PlatformIO build paths cannot contain spaces.
  build_path: /private/tmp/air-stone-controller-build/${device_name}
  min_version: 2026.9.1
  includes:
    # Angle form places the type before generated globals; path form copies it.
    - <pump_controller.h>
    - pump_controller.h
    - solar_schedule.h
  project:
    name: hydroponics.air_stone_controller
    version: "0.4.0"
  on_boot:
    - priority: 700
      then:
        - switch.turn_off: pump_output
    - priority: -100
      then:
        - if:
            condition:
              lambda: return !id(solar_settings_applied);
            then:
              - number.set:
                  id: run_seconds
                  value: 15
              - number.set:
                  id: rest_minutes
                  value: 10
              - lambda: id(solar_settings_applied) = true;
        - lambda: |-
            id(controller).fault = id(saved_safety_trip);
            id(controller).schedule_now();
            id(awake_since) = id(last_activity) = millis();
            id(solar_ready) = true;
  on_shutdown:
    priority: 700
    then:
      - switch.turn_off: pump_output

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Explicitly requested for this module after repeat startup resets.
      CONFIG_ESP_BROWNOUT_DET: "n"

logger:
  # Keep startup I2C scan diagnostics; suppress per-sample telemetry chatter.
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    sensor: INFO
    text_sensor: INFO
    binary_sensor: INFO
    switch: INFO
    wifi: INFO
    api: INFO

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key
  # Continue the local schedule if Home Assistant is offline.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption: {}
    on_begin:
      then:
        - lambda: |-
            id(maintenance) = true;
            id(dose_started) = true;
            id(controller).stop(millis());
        - switch.turn_off: pump_output
    on_error:
      then:
        - lambda: id(maintenance) = false;

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  reboot_timeout: 0s

time:
  - platform: homeassistant
    id: local_clock
    timezone: Asia/Singapore

deep_sleep:
  id: solar_sleep
  sleep_duration: 60min
  wakeup_pin:
    number: ${manual_button_pin}
    inverted: true
    mode:
      input: true
      pullup: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE
  on_wake:
    then:
      - lambda: |-
          if (cause == deep_sleep::WAKEUP_CAUSE_GPIO) {
            id(button_wake) = true;
            id(dose_started) = true;
          }

preferences:
  flash_write_interval: 5min

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 50kHz

globals:
  - id: controller
    type: air_stone::PumpController
    restore_value: false
    initial_value: 'air_stone::PumpController()'
  - id: last_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sample_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  # 0.3.0 held its safety trip in RAM; require an explicit clear on first
  # solar boot so the OTA migration cannot silently bypass that prior trip.
  - id: saved_safety_trip
    type: bool
    restore_value: true
    initial_value: 'true'
    update_interval: 250ms
  - id: solar_settings_applied
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: awake_since
    type: uint32_t
    initial_value: '0'
  - id: last_activity
    type: uint32_t
    initial_value: '0'
  - id: solar_ready
    type: bool
    initial_value: 'false'
  - id: dose_started
    type: bool
    initial_value: 'false'
  - id: button_wake
    type: bool
    initial_value: 'false'
  - id: hold_awake_since
    type: uint32_t
    initial_value: '0'
  - id: maintenance
    type: bool
    restore_value: false
    initial_value: 'false'

switch:
  - platform: gpio
    id: pump_output
    internal: true
    pin: ${pump_pin}
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Automatic Schedule
    id: automatic_schedule
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: |-
          if (!id(solar_ready)) return;
          id(dose_started) = false;
          id(controller).schedule_now();
    turn_off_action:
      - script.execute: stop_current_cycle
  - platform: template
    name: Stay Awake
    id: stay_awake
    icon: mdi:sleep-off
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(hold_awake_since) = millis();
  - platform: template
    name: Pump
    id: pump_control
    icon: mdi:air-filter
    lambda: return id(pump_output).state;
    turn_on_action:
      - lambda: id(controller).request_run();
    turn_off_action:
      - script.execute: stop_current_cycle

script:
  - id: persist_safety_trip
    then:
      - lambda: |-
          // Store the changed latch before flushing NVS, even if power is
          // removed before the normal deep-sleep shutdown.
          saved_safety_trip->update();
          global_preferences->sync();
  - id: stop_current_cycle
    then:
      - lambda: |-
          id(controller).stop(millis());
          id(dose_started) = true;
          id(last_activity) = millis();
      - switch.turn_off: pump_output

number:
  - platform: template
    name: Pump Run Time
    id: run_seconds
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: s
    mode: box
    entity_category: config
  - platform: template
    name: Pump Rest Time
    id: rest_minutes
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box
    entity_category: config

button:
  - platform: template
    name: Run Pump Once
    icon: mdi:play
    on_press:
      - lambda: id(controller).request_run();
  - platform: template
    name: Stop Pump
    icon: mdi:stop
    on_press:
      - script.execute: stop_current_cycle
  - platform: template
    name: Clear Safety Trip
    entity_category: config
    on_press:
      - lambda: |-
          const bool healthy = id(sample_seen) &&
              millis() - id(last_sample_ms) < 5000U &&
              std::isfinite(id(battery_voltage).state) &&
              id(battery_voltage).state >= ${battery_recovery} &&
              id(battery_voltage).state <= 4.35f &&
              std::isfinite(id(battery_current).state) &&
              std::fabs(id(battery_current).state) < ${current_limit};
          if (id(controller).clear_fault(healthy, millis())) {
            id(saved_safety_trip) = false;
            id(persist_safety_trip).execute();
            id(dose_started) = true;
            id(last_activity) = millis();
          } else {
            ESP_LOGW("pump", "Cannot clear: need fresh INA219, battery >= ${battery_recovery} V and safe current");
          }
  - platform: restart
    name: Restart
    entity_category: diagnostic

sensor:
  - platform: ina219
    id: battery_monitor
    address: ${ina219_address}
    shunt_resistance: ${shunt_resistance}
    max_voltage: 16.0V
    max_current: 3.2A
    update_interval: 1s
    bus_voltage:
      name: Load Bus Voltage
      id: bus_voltage
      accuracy_decimals: 3
      entity_category: diagnostic
    shunt_voltage:
      name: Shunt Voltage
      id: shunt_voltage
      accuracy_decimals: 4
      entity_category: diagnostic
    current:
      name: Battery Current
      id: battery_current
      accuracy_decimals: 3
    power:
      # Last published field in ESPHome 2026.9.1's INA219 update():
      # only mark a complete sample fresh after all four register reads succeed.
      id: ina_power
      internal: true
      on_value:
        then:
          - lambda: |-
              id(last_sample_ms) = millis();
              id(sample_seen) = true;
              // INA219 bus voltage is VIN- to GND. Add shunt drop to recover VIN+.
              const float voltage = id(bus_voltage).state + id(shunt_voltage).state;
              const float current = id(battery_current).state;
              id(controller).sample(id(last_sample_ms), voltage);
              id(battery_voltage).publish_state(voltage);
              id(battery_power).publish_state(voltage * current);
              // Separate discharge from charging for HA energy statistics.
              id(discharge_power).publish_state(std::fmax(0.0f, voltage * current));
  - platform: template
    name: Battery Voltage
    id: battery_voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    name: Pre-Pump Battery Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(controller).resting_voltage;
    update_interval: 1s
  - platform: template
    name: Minimum Pump Battery Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(controller).loaded_min_voltage;
    update_interval: 1s
  - platform: template
    name: Pump Voltage Sag
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(controller).voltage_sag();
    update_interval: 1s
  - platform: template
    name: Battery Power
    id: battery_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    name: Discharge Power
    id: discharge_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: integration
    name: Energy Used
    sensor: discharge_power
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 4
  - platform: template
    name: Next Sleep Duration
    id: next_sleep_duration
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: Pump Button
    id: physical_pump_button
    pin:
      number: ${manual_button_pin}
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 40ms
    on_press:
      then:
        - lambda: |-
            if (!id(solar_ready) || id(maintenance)) return;
            const bool start = id(controller).toggle(millis());
            if (!start) id(stop_current_cycle).execute();
            ESP_LOGI("pump", "GPIO0 button: %s", start ? "timed run requested" : "stopped");
  - platform: status
    name: Online
  - platform: template
    name: Pump Output Active
    # Output commanded on; a single shared INA219 cannot prove pump operation.
    lambda: return id(pump_output).state;
  - platform: template
    name: Safety Trip
    device_class: problem
    lambda: return id(controller).fault;
  - platform: template
    name: Power Monitor Healthy
    lambda: |-
      return id(sample_seen) && millis() - id(last_sample_ms) < 5000U &&
             std::isfinite(id(battery_voltage).state) &&
             id(battery_voltage).state > 0.0f && id(battery_voltage).state <= 4.35f &&
             std::isfinite(id(battery_current).state);

text_sensor:
  - platform: template
    name: Pump Status
    lambda: return {id(controller).status};
    update_interval: 1s
  - platform: template
    name: Solar Sleep Profile
    id: solar_sleep_profile
    update_interval: never
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(solar_ready)) return;
          if (id(maintenance)) {
            id(pump_output).turn_off();
            return;
          }
          const auto now = millis();
          const bool fresh = id(sample_seen) && now - id(last_sample_ms) < 5000U;
          if (id(stay_awake).state && now - id(hold_awake_since) >= 600000U)
            id(stay_awake).turn_off();
          // Do not extrapolate the last power measurement across a sensor outage.
          if (!fresh && id(discharge_power).state != 0.0f) {
            id(discharge_power).publish_state(0.0f);
            id(battery_power).publish_state(NAN);
            id(battery_voltage).publish_state(NAN);
            id(battery_current).publish_state(NAN);
          }
          auto &pump = id(controller);
          const bool auto_due = id(automatic_schedule).state && !id(dose_started);
          const bool run = pump.tick(now, auto_due,
              uint32_t(id(run_seconds).state * 1000.0f), 0, fresh,
              id(battery_voltage).state, id(battery_current).state,
              ${battery_cutoff}, ${current_limit}, air_stone::SOLAR_MIN_VOLTAGE);
          if (run != id(pump_output).state) {
            if (run) {
              id(dose_started) = true;
              id(pump_output).turn_on();
            } else {
              id(pump_output).turn_off();
            }
            id(last_activity) = now;
            ESP_LOGI("pump", "%s", pump.status);
          }
          if (id(saved_safety_trip) != pump.fault) {
            id(saved_safety_trip) = pump.fault;
            id(persist_safety_trip).execute();
          }
          if (run || pump.pending()) id(last_activity) = now;

          // Use the pre-load average if a dose ran; otherwise use the current
          // rested sample. A failed monitor always gets the long fallback.
          const float current = id(battery_current).state;
          const bool monitor_valid = fresh && std::isfinite(current) &&
              std::fabs(current) < ${current_limit};
          const float rested = !monitor_valid ? NAN : std::isfinite(pump.resting_voltage)
              ? pump.resting_voltage : id(battery_voltage).state;
          const auto clock = id(local_clock).now();
          const auto sleep = air_stone::select_sleep(rested, pump.fault,
              clock.is_valid() ? clock.hour : -1, uint32_t(id(rest_minutes).state));
          if (id(next_sleep_duration).state != float(sleep.minutes))
            id(next_sleep_duration).publish_state(sleep.minutes);
          if (id(solar_sleep_profile).state != sleep.reason)
            id(solar_sleep_profile).publish_state(sleep.reason);

          // Budget Wi-Fi/HA time without making it a dependency for pumping.
          // The physical wake button opens a longer maintenance window.
          if (id(stay_awake).state || run || pump.pending() ||
              id(physical_pump_button).state ||
              now - id(awake_since) < (id(button_wake) ? 60000U : 20000U)) return;
          const uint32_t report_time = id(api_server).is_connected_with_state_subscription()
              ? 5000U : 25000U;
          if (now - id(last_activity) < report_time) return;
          id(pump_output).turn_off();
          ESP_LOGI("solar", "Deep sleeping for %u min: %s", static_cast<unsigned>(sleep.minutes), sleep.reason);
          id(solar_sleep).set_sleep_duration(sleep.minutes * 60000U);
          id(solar_sleep).begin_sleep(true);
